upstream backend_servers {
    server server-1:5000 max_fails=1 fail_timeout=5s;
    server server-2:5000 max_fails=1 fail_timeout=5s;
    server server-3:5000 max_fails=1 fail_timeout=5s;
}

server {
    listen 80;
    server_name localhost;

    # Reverse Proxy & Load Balancer (Round Robin) cho Backend API
    location /api/ {
        proxy_pass http://backend_servers;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Chuyển hướng nhanh sang server khác nếu 1 backend gặp sự cố
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # Reverse Proxy cho Frontend (React + Vite)
    location / {
        proxy_pass http://client:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
